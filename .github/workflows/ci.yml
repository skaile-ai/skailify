# SPDX-License-Identifier: Apache-2.0
#
# Repository checks: DCO sign-off on pull requests, SPDX headers, and the
# example adapter through the reusable adapter workflow. An adapter adds its
# own job here that calls adapter.yml (see docs/ci-template.md).

name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/check-dco.sh "$BASE_SHA" "$HEAD_SHA"

  spdx:
    name: SPDX headers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: .github/scripts/check-spdx.sh

  example:
    name: example adapter
    uses: ./.github/workflows/adapter.yml
    with:
      path: frontend/_example
      kind: js

  example-broken:
    name: example adapter (deliberately broken, temporary)
    uses: ./.github/workflows/adapter.yml
    with:
      path: frontend/_example-broken
      kind: js
