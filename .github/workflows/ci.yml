# SPDX-License-Identifier: Apache-2.0
#
# Repository checks: DCO sign-off on pull requests, SPDX headers, and the
# example adapter through the reusable adapter workflow. An adapter adds its
# own job here that calls adapter.yml (see docs/ci-template.md).

name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dco:
    name: DCO sign-off
    # The release bot's "Version Packages" pull request (release.yml) only
    # bumps versions and changelogs from changesets that were signed off when
    # they landed; its own commit cannot carry a person's sign-off.
    if: >-
      github.event_name == 'pull_request' &&
      !(github.head_ref == 'changeset-release/main' &&
        github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/check-dco.sh "$BASE_SHA" "$HEAD_SHA"

  spdx:
    name: SPDX headers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: .github/scripts/check-spdx.sh

  # release.yml installs with --frozen-lockfile; fail here, not at release time.
  lockfile:
    name: Lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.12
      - run: bun install --frozen-lockfile

  changeset:
    name: Changeset
    if: >-
      github.event_name == 'pull_request' &&
      !(github.head_ref == 'changeset-release/main' &&
        github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/check-changeset.sh "$BASE_SHA" "$HEAD_SHA"

  vue-tsm:
    name: vue-tsm adapter
    uses: ./.github/workflows/adapter.yml
    with:
      path: frontend/vue-tsm
      kind: js

  example:
    name: example adapter
    uses: ./.github/workflows/adapter.yml
    with:
      path: frontend/_example
      kind: js

  # JDK 21: the pinned Fennec snapshot builds are Java 21 class files.
  emf-mcp:
    name: emf-mcp adapter
    uses: ./.github/workflows/adapter.yml
    with:
      path: backend/emf-mcp
      kind: java
      app-sdk-range: ^10.4.0
      java-version: "21"
      java-start-command: ./gradlew --no-daemon --quiet run.example
      mcp-url: http://127.0.0.1:8080/mcp

  react:
    name: react adapter
    uses: ./.github/workflows/adapter.yml
    with:
      path: frontend/react
      kind: js

  angular:
    name: angular adapter
    uses: ./.github/workflows/adapter.yml
    with:
      path: frontend/angular
      kind: js
