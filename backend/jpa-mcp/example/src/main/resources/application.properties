spring.application.name=skailify-jpa-mcp-example

# Loopback only: this example serves its MCP endpoint without authentication.
server.address=127.0.0.1
server.port=8080

spring.datasource.url=jdbc:h2:mem:shop;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false
spring.sql.init.mode=always

skailify.mcp.server-name=skailify-jpa-mcp-example
# For local development only; a real app protects /mcp with Spring Security.
skailify.mcp.allow-unauthenticated=true
